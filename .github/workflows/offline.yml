name: NANROBOT offline publishing
on:
  schedule:
    - cron: '7 1,13 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: Send report using configured SMTP Secrets
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['offline.py', 'test_offline.py', 'queue.json', '.github/workflows/offline.yml']
permissions:
  contents: read
concurrency:
  group: nanrobot-offline-publishing
  cancel-in-progress: false
jobs:
  trigger-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate queue and reporting behavior
        run: python -m unittest test_offline.py
      - name: Trigger WordPress and verify due publications
        env:
          SEND_EMAIL: ${{ inputs.send_email }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python offline.py
